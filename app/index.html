<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWS CI/CD Pipeline — ECS Fargate</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #0b1220;
      color: #f1f5f9;
      font: 1rem/1.6 system-ui, sans-serif;
    }
    main {
      width: min(100%, 48rem);
      padding: clamp(1.5rem, 6vw, 4rem);
      background: #151f31;
      border: 1px solid #334155;
      border-radius: 1.25rem;
    }
    .version {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: #203e37;
      color: #a7f3d0;
      font-size: 0.875rem;
      font-weight: 650;
    }
    h1 {
      margin: 1rem 0 0.75rem;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }
    p { margin: 0; color: #cbd5e1; }
  </style>
</head>
<body>
  <main>
    <span class="version">Version: v2.0.0</span>
    <h1>AWS CI/CD Pipeline — ECS Fargate</h1>
    <p>GitHub Actions (OIDC) → Amazon ECR → Amazon ECS Fargate</p>
  </main>
</body>
</html>
